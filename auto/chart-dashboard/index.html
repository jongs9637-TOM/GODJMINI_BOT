<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몸무게 그래프</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #fff8f0;
    --card: #ffffff;
    --accent: #ff7a45;
    --accent-dark: #e2622f;
    --text: #33291f;
    --muted: #9c9186;
    --border: #f0e3d4;
    --blue: #3b7dd8;
    --orange: #e2924f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "맑은 고딕", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin: 10px 0 24px;
  }
  #storageWarning {
    display: none;
    background: #fdecea;
    color: #a13c3c;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: .9rem;
    text-align: center;
  }
  #cdnWarning {
    display: none;
    background: #fdecea;
    color: #a13c3c;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: .9rem;
    text-align: center;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
  }
  .add-row {
    display: flex;
    gap: 8px;
  }
  .add-row input {
    padding: 16px;
    font-size: 1.05rem;
    border: 2px solid var(--border);
    border-radius: 14px;
    min-width: 0;
  }
  .add-row input.date { flex: 1.2; }
  .add-row input.value { flex: 1; }
  .add-row button {
    padding: 0 20px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-box {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
  }
  .summary-box .label { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  .summary-box .value { font-size: 1.6rem; font-weight: 800; color: var(--accent-dark); }
  .summary-box .value.up { color: var(--orange); }
  .summary-box .value.down { color: var(--blue); }
  .chart-wrap {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
    height: 260px;
  }
  .empty-msg {
    color: var(--muted);
    text-align: center;
    padding: 16px 0;
    font-size: .95rem;
  }
  .record-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .record-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 1rem;
  }
  .record-list li:last-child { border-bottom: none; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 2px 8px;
  }
</style>
</head>
<body>

  <h1>📈 몸무게 그래프</h1>

  <div id="storageWarning">
    ⚠️ 이 브라우저에서는 기록 저장이 안 돼요. 창을 닫으면 기록이 사라질 수 있습니다.
  </div>
  <div id="cdnWarning">
    ⚠️ 그래프 도구를 인터넷에서 못 불러왔어요. 인터넷 연결을 확인해주세요. (기록은 그대로 저장됩니다)
  </div>

  <div class="card">
    <div class="add-row">
      <input type="date" class="date" id="dateInput">
      <input type="number" class="value" id="weightInput" inputmode="decimal" placeholder="몸무게 (kg)">
      <button id="addButton">기록</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-box">
      <div class="label">이번 주 평균</div>
      <div class="value" id="weekAvgValue">-</div>
    </div>
    <div class="summary-box">
      <div class="label">지난주 대비</div>
      <div class="value" id="weekDeltaValue">-</div>
    </div>
  </div>

  <div class="chart-wrap">
    <canvas id="chartCanvas"></canvas>
  </div>

  <div class="card">
    <ul class="record-list" id="recordList"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'chart-dashboard-weight';

    let storageOK = true;
    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        storageOK = false;
        return fallback;
      }
    }
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        storageOK = false;
      }
      if (!storageOK) warningEl.style.display = 'block';
    }

    // records: [{ date: 'YYYY-MM-DD', value: 70.2 }]
    let records = safeGet(STORAGE_KEY, []);

    const dateInputEl = document.getElementById('dateInput');
    const weightInputEl = document.getElementById('weightInput');
    const addButtonEl = document.getElementById('addButton');
    const weekAvgValueEl = document.getElementById('weekAvgValue');
    const weekDeltaValueEl = document.getElementById('weekDeltaValue');
    const recordListEl = document.getElementById('recordList');
    const warningEl = document.getElementById('storageWarning');
    const cdnWarningEl = document.getElementById('cdnWarning');

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    dateInputEl.value = todayStr();

    function weekBounds(offsetWeeks) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      const dow = d.getDay();
      const diffToMonday = dow === 0 ? 6 : dow - 1;
      d.setDate(d.getDate() - diffToMonday + offsetWeeks * 7);
      const start = new Date(d);
      const end = new Date(d);
      end.setDate(end.getDate() + 6);
      return { start, end };
    }

    function toDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function avgInRange(startStr, endStr) {
      const values = records
        .filter(r => r.date >= startStr && r.date <= endStr)
        .map(r => r.value);
      if (values.length === 0) return null;
      return values.reduce((a, b) => a + b, 0) / values.length;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let chart = null;

    function renderChart() {
      if (typeof Chart === 'undefined') {
        cdnWarningEl.style.display = 'block';
        return;
      }

      const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
      const labels = sorted.map(r => r.date.slice(5));
      const data = sorted.map(r => r.value);

      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = data;
        chart.update();
        return;
      }

      const ctx = document.getElementById('chartCanvas').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '몸무게 (kg)',
            data,
            borderColor: '#ff7a45',
            backgroundColor: 'rgba(255,122,69,.15)',
            tension: .25,
            fill: true,
            pointRadius: 4,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: false } },
        },
      });
    }

    function renderSummary() {
      const thisWeek = weekBounds(0);
      const lastWeek = weekBounds(-1);

      const thisAvg = avgInRange(toDateStr(thisWeek.start), toDateStr(thisWeek.end));
      const lastAvg = avgInRange(toDateStr(lastWeek.start), toDateStr(lastWeek.end));

      weekAvgValueEl.textContent = thisAvg === null ? '-' : thisAvg.toFixed(1) + 'kg';

      if (thisAvg === null || lastAvg === null) {
        weekDeltaValueEl.textContent = '-';
        weekDeltaValueEl.className = 'value';
      } else {
        const delta = thisAvg - lastAvg;
        const sign = delta > 0 ? '+' : '';
        weekDeltaValueEl.textContent = `${sign}${delta.toFixed(1)}kg`;
        weekDeltaValueEl.className = 'value ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : '');
      }
    }

    function renderList() {
      recordListEl.innerHTML = '';

      if (records.length === 0) {
        recordListEl.innerHTML = '<div class="empty-msg">기록이 없어요</div>';
        return;
      }

      const sorted = records
        .map((r, i) => ({ ...r, _index: i }))
        .sort((a, b) => b.date.localeCompare(a.date));

      sorted.forEach(r => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${escapeHtml(r.date)}</span><span>${r.value}kg</span>`;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '×';
        delBtn.onclick = () => {
          records.splice(r._index, 1);
          save();
          renderAll();
        };

        li.appendChild(delBtn);
        recordListEl.appendChild(li);
      });
    }

    function renderAll() {
      renderChart();
      renderSummary();
      renderList();
    }

    function addRecord() {
      const date = dateInputEl.value;
      const value = parseFloat(weightInputEl.value);

      if (!date) return;
      if (!weightInputEl.value || isNaN(value)) {
        const original = weightInputEl.placeholder;
        weightInputEl.placeholder = '숫자를 입력해주세요';
        weightInputEl.style.borderColor = '#e2622f';
        setTimeout(() => {
          weightInputEl.placeholder = original;
          weightInputEl.style.borderColor = '';
        }, 1500);
        return;
      }

      const existingIndex = records.findIndex(r => r.date === date);
      if (existingIndex >= 0) {
        records[existingIndex].value = value;
      } else {
        records.push({ date, value });
      }

      weightInputEl.value = '';
      save();
      renderAll();
    }

    addButtonEl.onclick = addRecord;
    weightInputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') addRecord();
    });

    if (!storageOK) warningEl.style.display = 'block';
    renderAll();
  </script>

</body>
</html>
